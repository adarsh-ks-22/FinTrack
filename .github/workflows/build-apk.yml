name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build:
    name: Build Standalone Release APK
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --legacy-peer-deps

      - name: 🏗️ Expo Prebuild (Generate Android native project)
        run: npx expo prebuild --platform android --clean

      - name: ⚙️ Patch Android build features, WatermelonDB & Release Signing
        run: |
          echo "android.defaults.buildfeatures.buildconfig=true" >> android/gradle.properties
          echo "expo.inlineModules.watchedDirectories=[]" >> android/gradle.properties
          echo "android.enableProguardInReleaseBuilds=false" >> android/gradle.properties
          node scripts/patch-watermelondb.js

      - name: ⚡ Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: 🔑 Grant execute permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: 🚀 Build Standalone Release APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: 📤 Upload Standalone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinTrack-Standalone-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
